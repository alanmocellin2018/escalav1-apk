name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Instalar Flet e Compilar APK
        run: |
          python -m pip install --upgrade pip
          pip install flet openpyxl
          
          # Se o seu código estiver dentro da pasta "Escala_Hospitalar":
          flet build apk Escala_Hospitalar -v
          
          # OBS: Se os arquivos do seu app (main.py) estiverem direto na raiz do repositório, 
          # substitua a linha acima apenas por: flet build apk -v

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Aplicativo-Escala-APK
          path: build/apk/*.apk